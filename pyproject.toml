[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Agentic SDLC Pipeline"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.27",
    "langchain>=0.1.20",
    "langchain-azure-ai>=0.1.0",
    "azure-identity>=1.15.0",
    "neo4j>=5.15.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "asyncpg>=0.29.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["skills/.*/v\\d+"]

[tool.ruff]
line-length = 100
target-version = "py310"
